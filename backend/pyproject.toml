[tool.poetry]
name = "vyaparpro-backend"
version = "2.0.0"
description = "VyaparPro ERP – Production FastAPI Backend"
authors = ["VyaparPro Team <dev@vyaparpro.in>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
pydantic = {extras = ["email"], version = "^2.7.0"}
pydantic-settings = "^2.2.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.29"}
asyncpg = "^0.29.0"
aiosqlite = "^0.20.0"
alembic = "^1.13.1"
psycopg2-binary = "^2.9.9"
redis = {extras = ["asyncio"], version = "^5.0.4"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
bcrypt = "4.0.1"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
python-multipart = "^0.0.9"
httpx = "^0.27.0"
celery = {extras = ["redis"], version = "^5.4.0"}
flower = "^2.0.1"
loguru = "^0.7.2"
sentry-sdk = {extras = ["fastapi"], version = "^2.3.0"}
boto3 = "^1.34.85"
python-dotenv = "^1.0.1"
cryptography = "^42.0.5"
pyotp = "^2.9.0"
pillow = "^10.3.0"
openpyxl = "^3.1.2"
reportlab = "^4.1.0"
aiofiles = "^23.2.1"
orjson = "^3.10.3"
slowapi = "^0.1.9"
faker = "^24.11.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-asyncio = "^0.23.6"
pytest-cov = "^5.0.0"
httpx = "^0.27.0"
factory-boy = "^3.3.0"
black = "^24.4.0"
ruff = "^0.4.2"
mypy = "^1.9.0"
pre-commit = "^3.7.0"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-report=html"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
